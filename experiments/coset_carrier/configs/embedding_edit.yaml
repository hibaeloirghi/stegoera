# Comparison to the null-null smoke: null inversion, edit prompt, matched receiver (needs the prompt).
experiment_id: cc_null_edit
seed: 1
device: cuda

edict:
  # S=25, s=0.7 only denoised from t=640 (17 steps) and never turned the photo into the
  # edit. Match the schedule that did: S=50, s=0.8, p=0.93 (40 steps, out to t=780).
  steps: 50
  strength: 0.8
  mix_weight: 0.93
  p_ref: 0.93
  base_prompt: ""
  edit_prompt: "A golden retriever"
  guidance_scale: 3.0
  k_fraction: 0.5          # n=40 -> site k = 20, the previous S4 site

prc:
  key_message_length: 64
  message_length: 64
  fpr: 1.0e-5
  t: 3
  coset_candidates: 256    # R

carrier:
  prc_block: carrier       # carrier: PRC key of length n_carrier on the masked coords; full: 16384 key
  n_carrier: 2048          # or 4096
  sigma_lo: 0.7
  sigma_hi: 2.0
  smooth: 2.0

loss:
  m_target: 20.0
  gamma: 0.5
  lambda_code: 20.0
  lambda_vis: 20.0
  nu_mse: 0.0
  sigma_squared: 1.5

optim:
  iters: 40
  lr: 0.03
  unet_dtype: float32      # surrogate only; true channel is fp64 (validated: gradcheck job 7788045)
  optimize_y: true

receiver:
  decoder_inv_steps: 50

lpips_target: 0.015
