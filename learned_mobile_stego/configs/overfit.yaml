# Learnability probe: four 32x32 covers, clean channel, enough steps to move message BER.
seed: 0
device: auto
image_size: 32
batch_size: 4
epochs: 20
steps_per_epoch: 8
message_bits: 64
target_ber: 0.10
alpha: 0.4
base_channels: 16
lr: 0.001
lambda_msg: 1.0
lambda_perc: 0.05
lambda_l1: 0.2
lambda_adv: 0.0
image_warmup_epochs: 30
key: 7
num_synthetic: 4
eval_images: 4
output_dir: results/overfit
curriculum:
  clean_until: 100
  jpeg_until: 100
  full_until: 100
